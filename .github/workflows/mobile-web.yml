name: Optimize mobile Web build
on:
  push:
    branches: [main]
    paths: ['Tools/optimize_web.py', '.github/workflows/mobile-web.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mobile-web-publish
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep optimizer
        run: cp Tools/optimize_web.py /tmp/optimize_web.py
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: web
      - name: Compress and limit render resolution
        run: python3 /tmp/optimize_web.py web
      - name: Save published build
        working-directory: web
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html Build/Web.data.gz Build/Web.wasm.gz
          git diff --cached --quiet || git commit -m 'Reduce mobile download and render resolution'
          git push origin gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: optimize
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
